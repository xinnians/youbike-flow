name: collect

on:
  schedule:
    # 每 5 分鐘，錯開整點（官方文件：整點負載高，排隊的 job 可能被丟棄）
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

# 同時只跑一個，避免兩次推送互相衝突
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - run: pip install -q -r requirements-collector.txt
      - name: 抓快照並推到 data 分支
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}
        run: bash collector/push_to_data_branch.sh
